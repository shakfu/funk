# Build funk and run the test suite on Linux and macOS, plain and with
# funk built under UBSan, ASan and TSan. The sqlite, PCRE2 and GMP tests run
# where their headers are installed and are skipped otherwise; under ASan and
# TSan, the tests the sanitizer itself changes are disabled (tests/CMakeLists.txt,
# at its end).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}${{ matrix.sanitize && format(' ({0})', matrix.sanitize) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitize: ["", undefined, address, thread]
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev libgmp-dev libpcre2-dev

      # TSan rejects the address layout of mmap randomization above 28 bits, every
      # funk process's under FUNK_SANITIZE=thread
      - name: Lower mmap randomization for TSan (Linux)
        if: runner.os == 'Linux' && matrix.sanitize == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      # where a crash's core goes: a pipe dumps untouched reserved pages as zeros
      - name: Show core dump settings (Linux)
        if: runner.os == 'Linux'
        run: |
          cat /proc/sys/kernel/core_pattern
          ulimit -c

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja gmp pcre2

      # LeakSanitizer, on with ASan on Linux: funk frees a session's memory, not the
      # process's at exit
      - name: Build and test
        env:
          ASAN_OPTIONS: ${{ matrix.sanitize == 'address' && 'detect_leaks=0' || '' }}
        run: make SANITIZE=${{ matrix.sanitize }} test

  # the CLAP plugin, built and run in a headless host; its other tests run above
  plugin:
    name: plugin on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libgl-dev libopengl-dev libasound2-dev libudev-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFUNK_CLAP=ON
          cmake --build build -- -k 0
          ctest --test-dir build -L clap --no-tests=error --output-on-failure

  # the Linux plugin cross-built on macOS with zig cc (docs/dev/cross-build.md) ...
  plugin-zig:
    name: plugin cross-built with zig cc
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install dependencies
        run: brew install ninja

      - name: Build the host tools
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --target funk embed

      - name: Make a Linux sysroot
        run: tools/linux-sysroot.sh "$RUNNER_TEMP/sysroot"

      - name: Cross-build the plugin
        run: |
          export FUNK_SYSROOT="$RUNNER_TEMP/sysroot"
          cmake -S . -B xbuild -G Ninja -DCMAKE_TOOLCHAIN_FILE=tools/zig-linux.cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFUNK_CLAP=ON -DLIBREMIDI_NO_UDEV=ON -DFUNK_HOST_TOOLS="$PWD/build"
          cmake --build xbuild --target funk_midi_clap

      - uses: actions/upload-artifact@v4
        with:
          name: funk-midi-clap-zig
          path: |
            xbuild/clap/funk-midi.clap
            xbuild/clap/funkdsp.so
          if-no-files-found: error

  # ... and run on Linux in the headless host, against the cases hosts/clap runs
  plugin-zig-run:
    name: plugin cross-built with zig cc, run on Linux
    needs: plugin-zig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libgl-dev libopengl-dev libasound2-dev libudev-dev

      - uses: actions/download-artifact@v4
        with:
          name: funk-midi-clap-zig
          path: zig-plugin

      - name: Build the host
        run: |
          cmake -S . -B build -G Ninja -DFUNK_CLAP=ON
          cmake --build build --target test_clap_host

      - name: Run the plugin
        # the plugin listens on this port, the host's argument only says where it sends, as ctest's hosts/clap
        env:
          FUNK_MIDI_CLAP_UDP_PORT: "57291"
        run: build/test_clap_host zig-plugin/funk-midi.clap tests/hosts/clap.txt 57291
