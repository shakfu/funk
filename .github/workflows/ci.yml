# Build funk and run the test suite on Linux and macOS, plain and with
# funk built under UBSan and under ASan. The sqlite, PCRE2 and GMP tests run
# where their headers are installed and are skipped otherwise; under ASan, the
# tests ASan itself changes are disabled (tests/CMakeLists.txt, at its end).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}${{ matrix.sanitize && format(' ({0})', matrix.sanitize) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitize: ["", undefined, address]
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev libgmp-dev libpcre2-dev

      # where a crash's core goes: a pipe dumps untouched reserved pages as zeros
      - name: Show core dump settings (Linux)
        if: runner.os == 'Linux'
        run: |
          cat /proc/sys/kernel/core_pattern
          ulimit -c

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja gmp pcre2

      # LeakSanitizer, on with ASan on Linux: funk frees a session's memory, not the
      # process's at exit
      - name: Build and test
        env:
          ASAN_OPTIONS: ${{ matrix.sanitize == 'address' && 'detect_leaks=0' || '' }}
        run: make SANITIZE=${{ matrix.sanitize }} test
